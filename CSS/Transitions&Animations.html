<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>CSS Tansitions and Animations Demooo</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background: #7e57c2;
            border-radius: 10px;
            margin: 50px auto;
            transition: background 0.8s, transform 0.5s;
        }

        .box:hover {
            background: #ffeb3b;
            transform: scale(1.15) rotate(20deg);
        }

        .animated {
            width: 100px;
            height: 100px;
            background: #26c6da;
            border-radius: 10px;
            margin: 50px auto;
            animation: movebox 2s infinite alternate;
        }

        @keyframes movebox {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(120px) scale(1.2);
                background: #ab47bc;
            }
        }
    </style>
</head>

<body>
    <h1>CSS Tansitions and Animations</h1>
    <div class="box"></div>
    <p>Hover the purple box above!</p>
    <div class="animated"></div>
    <p>The blue box animates left and changes color</p>
</body>

</html>
