<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <title>CSS grids</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 2fe 1fr;
            grid-template-rows: 80px 120px;
            gap: 16px;
            background: #fce4ec;
            padding: 20px;
            border-radius: 10px;
        }

        .grid-item {
            background: #7b92a4;
            color: #333;
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.3em;
        }

        .wide {
            grid-column: 1/span 3;
            background: #ffdd77;
        }

        .tall {
            grid-row: 1/span 2;
            background: #c8e6c9;
        }
    </style>
</head>

<body>
    <h1>CSS Grid</h1>
    <div class="grid-container">
        <div class="grid-item wide">Wide across all columns</div>
        <div class="grid-item">One</div>
        <div class="grid-item tall">Tall (spans two rows)</div>
        <div class="grid-item">Three</div>
        <div class="grid-item">Four</div>
    </div>
</body>

</html>
